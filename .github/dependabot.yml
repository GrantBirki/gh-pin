---
version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: monthly
  groups:
    go-dependencies:
      patterns:
      - "*"
  cooldown:
    default-days: 45
- package-ecosystem: github-actions
  directory: "/"
  groups:
    github-actions:
      patterns:
      - "*"
  schedule:
    interval: monthly
  cooldown:
    default-days: 45
- package-ecosystem: docker-compose
  directory: "/test/fixtures"
  schedule:
    interval: monthly
  cooldown:
    default-days: 45
